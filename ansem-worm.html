<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>$ANSEM WORM</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    background:#0a0e1a;
    height:100%;
    overflow:hidden;
    font-family:'Segoe UI',Arial,sans-serif;
    color:#fff;
    touch-action:none;
  }
  #hud {
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    z-index:10;
    background:linear-gradient(180deg,rgba(10,14,26,0.9),transparent);
    pointer-events:none;
  }
  #hud h1 {
    font-size:16px;
    background:linear-gradient(90deg,#f7931a,#627eea,#14f195);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  #hud .stat { font-size:13px; font-weight:bold; color:#f5a623; }
  canvas { display:block; }

  #overlay {
    position:fixed;
    inset:0;
    background:rgba(8,6,16,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:100;
    text-align:center;
    padding:20px;
  }
  #overlay h2 { font-size:26px; color:#f5a623; margin-bottom:10px; }
  #overlay p { font-size:14px; color:#ccc; margin-bottom:18px; }
  #overlay button {
    background:linear-gradient(90deg,#f7931a,#627eea);
    border:none;
    color:#fff;
    padding:12px 28px;
    border-radius:22px;
    font-size:15px;
    font-weight:bold;
  }
  #startOverlay p { max-width:300px; }
  .overlayBox {
    position:fixed;
    inset:0;
    background:rgba(8,6,16,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:100;
    text-align:center;
    padding:20px;
  }
  .overlayBox h2 { font-size:26px; color:#f5a623; margin-bottom:10px; }
  .overlayBox p { font-size:14px; color:#ccc; margin-bottom:18px; }
  .overlayBox button {
    background:linear-gradient(90deg,#f7931a,#627eea);
    border:none;
    color:#fff;
    padding:12px 28px;
    border-radius:22px;
    font-size:15px;
    font-weight:bold;
  }
</style>
</head>
<body>
  <div id="hud">
    <h1>$ANSEM WORM</h1>
    <div class="stat">Score: <span id="scoreVal">0</span></div>
  </div>
  <canvas id="game"></canvas>

  <div id="overlay" style="display:none;">
    <h2 id="overTitle">GAME OVER</h2>
    <p id="overText"></p>
    <button id="restartBtn">Play Again</button>
  </div>

  <div class="overlayBox" id="startOverlay">
    <h2>$ANSEM WORM</h2>
    <p>Drag your finger on the screen to steer. Eat 🐂 $ANSEM, ₿ BTC, Ξ ETH, ◎ SOL and 🐕 DOGE to grow. Avoid walls, your own tail, and rival worms!</p>
    <button id="startBtn">Start</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const WORLD = 1800;
const TOKENS = [
  { emoji:'🐂', color:'#f5a623', name:'ANSEM', weight:3 },
  { emoji:'₿',  color:'#f7931a', name:'BTC', weight:1 },
  { emoji:'Ξ',  color:'#627eea', name:'ETH', weight:1 },
  { emoji:'◎',  color:'#14f195', name:'SOL', weight:1 },
  { emoji:'🐕', color:'#c2a633', name:'DOGE', weight:1 }
];

function pickToken() {
  const total = TOKENS.reduce((s,t)=>s+t.weight,0);
  let r = Math.random()*total;
  for (const t of TOKENS) { if (r<t.weight) return t; r-=t.weight; }
  return TOKENS[0];
}

let scoreValEl = document.getElementById('scoreVal');
let overlay = document.getElementById('overlay');
let overText = document.getElementById('overText');
let overTitle = document.getElementById('overTitle');

let player, bots, foods, score, running, pointerActive, pointerX, pointerY;

function makeWorm(x,y,segCount,color) {
  return {
    path: [{x,y}],
    angle: Math.random()*Math.PI*2,
    targetAngle: 0,
    segCount,
    gap: 4,
    speed: 2.4,
    color,
    alive:true
  };
}

function spawnFood() {
  const t = pickToken();
  return {
    x: Math.random()*WORLD,
    y: Math.random()*WORLD,
    token: t
  };
}

function initGame() {
  player = makeWorm(WORLD/2, WORLD/2, 8, '#f5a623');
  bots = [];
  for (let i=0;i<3;i++) {
    const bx = Math.random()*WORLD;
    const by = Math.random()*WORLD;
    const b = makeWorm(bx, by, 14, ['#e74c3c','#8e44ad','#2ecc71'][i%3]);
    b.turnTimer = 0;
    bots.push(b);
  }
  foods = [];
  for (let i=0;i<45;i++) foods.push(spawnFood());
  score = 0;
  scoreValEl.textContent = 0;
  running = true;
}

function updateWormAngle(worm, target, turnRate) {
  let diff = target - worm.angle;
  while (diff > Math.PI) diff -= Math.PI*2;
  while (diff < -Math.PI) diff += Math.PI*2;
  const maxTurn = turnRate;
  if (diff > maxTurn) diff = maxTurn;
  if (diff < -maxTurn) diff = -maxTurn;
  worm.angle += diff;
}

function stepWorm(worm) {
  const head = worm.path[0];
  const nx = head.x + Math.cos(worm.angle)*worm.speed;
  const ny = head.y + Math.sin(worm.angle)*worm.speed;
  worm.path.unshift({x:nx,y:ny});
  const maxLen = worm.segCount*worm.gap + 20;
  if (worm.path.length > maxLen) worm.path.length = maxLen;
}

function wormSegments(worm) {
  const segs = [];
  for (let i=0;i<worm.segCount;i++) {
    const idx = i*worm.gap;
    if (idx < worm.path.length) segs.push(worm.path[idx]);
  }
  return segs;
}

function dist2(a,b) {
  const dx=a.x-b.x, dy=a.y-b.y;
  return dx*dx+dy*dy;
}

function endGame(msg) {
  running = false;
  overTitle.textContent = 'GAME OVER';
  overText.textContent = msg + ` Final score: ${score}`;
  document.getElementById('overlay').style.display='flex';
}

function update() {
  if (!running) return;

  if (pointerActive) {
    const dx = pointerX - W/2;
    const dy = pointerY - H/2;
    if (Math.hypot(dx,dy) > 10) {
      player.targetAngle = Math.atan2(dy,dx);
    }
  }
  updateWormAngle(player, player.targetAngle, 0.06);
  stepWorm(player);

  const head = player.path[0];
  if (head.x<10||head.x>WORLD-10||head.y<10||head.y>WORLD-10) {
    endGame('You hit the wall!');
    return;
  }

  const segs = wormSegments(player);
  for (let i=8;i<segs.length;i++) {
    if (dist2(head, segs[i]) < 64) {
      endGame('You bit your own tail!');
      return;
    }
  }

  for (const b of bots) {
    b.turnTimer--;
    if (b.turnTimer<=0) {
      b.targetAngle = b.angle + (Math.random()-0.5)*1.6;
      b.turnTimer = 40 + Math.random()*60;
    }
    const bh = b.path[0];
    if (bh.x<40) b.targetAngle = 0;
    if (bh.x>WORLD-40) b.targetAngle = Math.PI;
    if (bh.y<40) b.targetAngle = Math.PI/2;
    if (bh.y>WORLD-40) b.targetAngle = -Math.PI/2;
    updateWormAngle(b, b.targetAngle, 0.05);
    stepWorm(b);

    const bsegs = wormSegments(b);
    for (const s of bsegs) {
      if (dist2(head, s) < 70) {
        endGame('You crashed into a rival worm!');
        return;
      }
    }
  }

  for (let i=foods.length-1;i>=0;i--) {
    const f = foods[i];
    if (dist2(head, f) < 400) {
      foods.splice(i,1);
      foods.push(spawnFood());
      player.segCount += 2;
      score += f.token.name==='ANSEM' ? 3 : 1;
      scoreValEl.textContent = score;
    }
  }
}

function draw() {
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0,0,W,H);

  if (!player) return;

  const head = player.path[0] || {x:WORLD/2,y:WORLD/2};
  const camX = head.x - W/2;
  const camY = head.y - H/2;

  ctx.save();
  ctx.translate(-camX, -camY);

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  const startX = Math.floor(camX/gridSize)*gridSize;
  const startY = Math.floor(camY/gridSize)*gridSize;
  for (let x=startX; x<camX+W+gridSize; x+=gridSize) {
    ctx.beginPath(); ctx.moveTo(x,camY); ctx.lineTo(x,camY+H); ctx.stroke();
  }
  for (let y=startY; y<camY+H+gridSize; y+=gridSize) {
    ctx.beginPath(); ctx.moveTo(camX,y); ctx.lineTo(camX+W,y); ctx.stroke();
  }

  // world boundary
  ctx.strokeStyle = '#f5a623';
  ctx.lineWidth = 6;
  ctx.strokeRect(0,0,WORLD,WORLD);

  // food
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of foods) {
    ctx.beginPath();
    ctx.arc(f.x,f.y,11,0,Math.PI*2);
    ctx.fillStyle = f.token.color;
    ctx.fill();
    ctx.font='13px sans-serif';
    ctx.fillStyle='#000';
    ctx.fillText(f.token.emoji, f.x, f.y+1);
  }

  // bots
  for (const b of bots) {
    const segs = wormSegments(b);
    for (let i=segs.length-1;i>=0;i--) {
      ctx.beginPath();
      ctx.arc(segs[i].x, segs[i].y, i===0?12:9, 0, Math.PI*2);
      ctx.fillStyle = b.color;
      ctx.fill();
    }
  }

  // player
  const psegs = wormSegments(player);
  for (let i=psegs.length-1;i>=0;i--) {
    ctx.beginPath();
    ctx.arc(psegs[i].x, psegs[i].y, i===0?13:10, 0, Math.PI*2);
    ctx.fillStyle = player.color;
    ctx.fill();
  }
  if (psegs.length) {
    ctx.font='16px sans-serif';
    ctx.fillText('🐂', psegs[0].x, psegs[0].y);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// input
pointerActive = false;
canvas.addEventListener('pointerdown', (e)=>{ pointerActive=true; pointerX=e.clientX; pointerY=e.clientY; });
canvas.addEventListener('pointermove', (e)=>{ if(pointerActive){ pointerX=e.clientX; pointerY=e.clientY; } });
canvas.addEventListener('pointerup', ()=>{ pointerActive=false; });
canvas.addEventListener('pointercancel', ()=>{ pointerActive=false; });

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('startOverlay').style.display='none';
  initGame();
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').style.display='none';
  initGame();
});

running = false;
loop();
</script>
</body>
</html>
